name: PDF Converter Workflow

on:
  push:
    branches:
      - main

jobs:
  # Шаг 1: Сборка и отправка образа на Docker Hub
  build_and_push_to_docker_hub:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker 
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push to DockerHub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: anastasiiaborisycheva/pdfconverter:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Шаг 2: Деплой на VPS (запустится ТОЛЬКО после успешной сборки)
  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push_to_docker_hub
    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/pdf_converter/
            
            # Pull latest images
            docker compose pull
            
            # Redeploy containers
            docker compose up -d --force-recreate
            
            # Cleanup old unused images
            docker image prune -f
            
            # Check status
            docker compose ps
            
            echo "Deployment completed successfully!"

  # Шаг 3: Уведомления в Telegram
  notify:
    runs-on: ubuntu-latest
    needs:
      - build_and_push_to_docker_hub
      - deploy
    if: always() # Выполняется всегда (и при успехе, и при ошибке)
    steps:
      - name: Send Telegram notification on SUCCESS
        if: needs.deploy.result == 'success'
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            <b>PDF Converter</b> успешно обновлён и запущен на продакшене!
            
            <b>Репозиторий:</b> ${{ github.repository }}
            <b>Коммит:</b> ${{ github.sha }}
            <b>Автор:</b> ${{ github.actor }}
          format: html

      - name: Send Telegram notification on FAILURE
        if: needs.build_and_push_to_docker_hub.result == 'failure' || needs.deploy.result == 'failure'
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            <b>Ошибка при деплое PDF Converter!</b>
            
            <b>Коммит:</b> ${{ github.sha }}
            <b>Автор:</b> ${{ github.actor }}
            Проверьте логи в GitHub Actions.
          format: html