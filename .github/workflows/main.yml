name: PDF Converter Workflow
on:
  push:
    branches:
      - main

# Перечень задач
jobs:
  # Шаг 1: Сборка и отправка образа на Docker Hub
  build_and_push_to_docker_hub:
    runs-on: ubuntu-latest
    steps:

      - name: Check out the repo
        # Получение исходного кода из репозитория
        uses: actions/checkout@v4

      - name: Login to Docker 
        # Авторизация на Docker Hub
        uses: docker/login-action@v3
        # При помощи with передаём в action параметры username и password
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push to DockerHub
        # Одновременный билд и пуш образа в Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: anastasiiaborisycheva/pdfconverter:latest 

  # Шаг 2: Деплой на VPS (запустится ТОЛЬКО после успешной сборки)
  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push_to_docker_hub
    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/pdf_converter/
            
            # Pull latest images
            docker compose -f docker-compose.yml pull
            
            # Redeploy containers
            docker compose -f docker-compose.yml up -d --force-recreate
            
            # Cleanup old images
            docker image prune -f
            
            # Check status
            docker compose -f docker-compose.yml ps
            
            echo "Deployment completed successfully!"

  # Шаг 3: Уведомление в Telegram
  notify-success:
    runs-on: ubuntu-latest
    needs:
      - deploy
      - build_and_push_to_docker_hub

    if: success()
    steps:
    - name: Send Telegram notification
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          PDF Converter successfully deployed to production!
